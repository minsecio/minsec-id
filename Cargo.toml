[workspace]
resolver = "2"
members = ["crates/minsec-id-bpf", "crates/minsec-id-core", "crates/minsec-id", "crates/minsec-id-sync"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-or-later"
repository = "https://github.com/minsecio/minsec-id"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
base64 = "0.22"
aya = { version = "0.14", default-features = false }
ed25519-dalek = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
# The minsec.io wire protocol, shared with minsec's own sync client.
minsec-proto = { git = "https://github.com/minsecio/minsec", rev = "a2bc30282125d7aa6d7f156e3d5a6d876c910deb" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "signal", "io-util", "sync", "macros"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
