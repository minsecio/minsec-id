name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GLIBC_FLOOR: "2.34"   # EL9; everything newer (EL10, Debian 12+, Ubuntu 22.04+) is covered

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag=${GITHUB_REF_NAME#v}
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="minsec-id") | .version')
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate — cut releases with scripts/release.sh"
            exit 1
          fi
      - name: Install packaging tools
        run: |
          sudo apt-get install -y clang
          # Exact versions, as in minsec: these tools produce what we ship.
          pip install ziglang==0.16.0
          cargo install --locked cargo-zigbuild@0.23.0 cargo-deb@3.7.0 cargo-generate-rpm@0.21.0
      - name: Build (glibc ${{ env.GLIBC_FLOOR }})
        run: |
          cargo zigbuild --release --target ${{ matrix.target }}.${{ env.GLIBC_FLOOR }} -p minsec-id -p minsec-id-sync
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/minsec-id target/${{ matrix.target }}/release/minsec-id-sync target/release/
      - name: Verify dependency floor
        run: |
          scripts/check-glibc.sh target/release/minsec-id ${{ env.GLIBC_FLOOR }}
          scripts/check-glibc.sh target/release/minsec-id-sync ${{ env.GLIBC_FLOOR }}
      - name: Package
        run: |
          cargo deb -p minsec-id --no-build --no-strip --target ${{ matrix.target }}
          cargo generate-rpm -p crates/minsec-id --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/debian/*.deb dist/
          cp target/${{ matrix.target }}/generate-rpm/*.rpm dist/
          cp target/release/minsec-id dist/minsec-id-${{ matrix.arch }}
          cp target/release/minsec-id-sync dist/minsec-id-sync-${{ matrix.arch }}
          ls -la dist
      - name: Inspect packages
        run: |
          for f in dist/*.deb; do dpkg-deb --info "$f" | sed -n '1,25p'; dpkg-deb --contents "$f"; done
          sudo apt-get install -y rpm >/dev/null
          for f in dist/*.rpm; do rpm -qip "$f"; rpm -qlp "$f"; rpm -qp --requires "$f"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*

  smoke:
    name: install smoke (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["almalinux:9", "almalinux:10", "debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04"]
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages-x86_64
          path: dist
      - name: Install and run
        run: |
          set -e
          if command -v dnf >/dev/null; then
            dnf install -y dist/*.x86_64.rpm
          else
            apt-get update -qq && apt-get install -y -qq ./dist/*_amd64.deb
          fi
          minsec-id --version
          minsec-id check
          minsec-id checks
          minsec-id inspect
          # The container shares the runner's kernel: clean (0) or tainted (2).
          rc=0; minsec-id scan || rc=$?
          test "$rc" -eq 0 -o "$rc" -eq 2
          minsec-id status
          minsec-id-sync --version
          # Not opted in: the timer's run is a quiet no-op.
          minsec-id-sync run
          test -s /usr/share/doc/minsec-id/sync.toml.example
          test -s /usr/share/man/man1/minsec-id-sync.1
          test -s /usr/share/man/man1/minsec-id.1
          test -s /usr/lib/systemd/system/minsec-id.service
          test -s /usr/share/bash-completion/completions/minsec-id

  release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir -p dist && cp artifacts/*/* dist/
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
